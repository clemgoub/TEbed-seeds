# TEbed-seeds pipeline configuration
contract_version: 1

vgp_tebed_repo: ~/Documents/VGP_TEbed   # sync-contract source (read-only)
work_dir: runs                          # --work-dir overrides (gitignored by default)

assembly: GCA_951799975.1
assembly_fasta: data/GCA_951799975.1.fna   # gunzip of GCA_951799975.1_fGobNig1.1_genomic.fna.gz; 298/298 names+lengths match chrom.sizes

# stage 0 -- candidate identification
edge_min_joint_bp: 500      # measured: 500 recovers MITE links 1kb starves (94 edges, 100% MITE-scale)
edge_min_reciprocal: 0.5    # joint >= this fraction of the SMALLER footprint
linkage: strict             # strict | lenient  (first batch: run both, compare)
density_tau: 0.5            # lenient mode: split clusters below this density
order_coherence_min: 0.667  # G3
gates:
  min_pooled_full_length: 5     # G1
  min_pooled_depth: 3           # G2
  max_tandem_overlap: 0.30      # G4
  max_median_divergence: 25.0   # G5
  min_tools: 2                  # G6

# stage 1 -- copies
merge_mode: both            # merge_always | gap_aware | both (first batch: both, compare)
flank_bp: 500
sampling:
  cap: 100
  floor: 10
  full_length_frac: 0.60

# stage 2-3 -- consensus + seed
seed:
  # a copy longer than this x the CLUSTER's modal consensus length is a tandem
  # multimer, not one copy -- measured: REPET's over-assembled 764 bp entry let
  # 495 and 642 bp copies of a 265 bp element into the cluster-62 seed
  max_copy_x_modal_consensus: 1.5
  min_match_occupancy: 0.5    # column is a consensus (match) column above this
  min_frag_bp: 30             # fragments below this carry no alignable signal

consensus_engine: mafft     # primary engine reported in the summary table
engines: [mafft, refiner]   # build the seed both ways and compare (step 4.7)
refiner_bin: vendor/refiner/bin/Refiner   # tools/setup_refiner.sh installs it
overextension_ratio: 1.5    # vs MEDIAN member consensus length
kimura_cpg: true            # --no-kimura-cpg to disable
# stk lint rejects abbreviated first names (au_format ERROR): "C. Goubert"
# fails, "Clement Goubert" passes. The ORCID prefix additionally clears the
# orcid_missing INFO and lets Dfam credit the curator unambiguously.
au_string: "ORCID:0000-0001-8034-5559 Clement Goubert"
taxon: "Gobius niger"          # #=GF OC, validated against NCBI taxonomy
tp_default: "Interspersed_Repeat;Unknown"   # until tp_map.tsv exists
tp_map: config/tp_map.tsv
stk_bin: vendor/dfam-curator/target/release/stk

tp_scheme_version: null
